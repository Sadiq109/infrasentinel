[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrasentinel"
version = "0.1.0"
description = "A privacy-first CLI that turns Linux authentication logs into queryable security findings."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sadiq Mohamud"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
infrasentinel = "infrasentinel.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
